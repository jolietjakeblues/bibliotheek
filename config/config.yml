### Linked Data ###
# base uri voor linked data, nodes worden op basis van deze uri opgebouwd:
#   {BASE_URI}{COLLECTION_ID}/id/{klasse}/{uuid}
BASE_URI: 'https://linkeddata.cultureelerfgoed.nl/'
COLLECTION_ID: 'rce/bibliotheek'
# uri van de dataset zelf (schema:isPartOf van elk record)
DATASET_URI: 'https://linkeddata.cultureelerfgoed.nl/rce/bibliotheek/'
DATASET_NAME: 'Bibliotheek RCE'
DATASET_DESCRIPTION: 'Boeken en tijdschriftartikelen uit de catalogus van de bibliotheek van de Rijksdienst voor het Cultureel Erfgoed.'

# Licentie van de metadata (IRI). Leeg = geen schema:license opnemen. Nog te besluiten.
LICENSE_URI: ''

### Adlib-API: volledige records ###
SRC_API: 'https://rce.adlibhosting.com/harvest/wwwopac.ashx'
SRC_API_DATABASE: 'books'      # standaard-alias; een bron kan met api_database een andere kiezen
# records per pagina; een pagina duurt 5 tot 17 seconden
SRC_API_LIMIT: 500
# pagina's tegelijk ophalen
SRC_API_WORKERS: 3

### OAI-PMH: selectie van openbare records en de tijdschriftgegevens van artikelen ###
SRC_URI: 'https://rce.adlibhosting.com/oaiapi/oai.ashx'
# pauze tussen OAI-pagina's (seconden); de bron levert 10 records per pagina
SRC_SLEEP: 0.05
# De OAI-lijst wordt in tijdvakken (op datestamp) verdeeld die tegelijk worden opgehaald; zonder dit duurde een boekenlijst
# van 182.000 records ruim drie uur. 1 = één lijst achter elkaar. SRC_OAI_WINDOW = maximaal aantal records per tijdvak.
SRC_OAI_WORKERS: 3
SRC_OAI_WINDOW: 10000
SRC_RETRIES: 5
SRC_BACKOFF: 2.0

# Bronnen. kind bepaalt welke transformatie wordt gebruikt (book | article).
#   api_search  zoekopdracht in het Adlib-API (alle records die erin vallen worden opgehaald)
#   api_database, api_fields  API-alias en de velden die worden opgevraagd (zie bij article)
#   scope       api: alles wat api_search oplevert (doel: een zo compleet mogelijke catalogus; besluit 1 en 10 in docs/besluiten.md)
#               oai: alleen records die de OAI-set publiceert (de OAI-sets zijn een zoekopdracht, geen publicatievlag)
#   exclude_priref  [[van, tot], ...] alleen bij scope oai: priref's in de OAI-selectie die bij een andere bron horen
#   oai         set en metadataPrefix; alleen nodig bij scope oai
SOURCES:
  books:
    kind: 'book'
    api_search: 'priref<200000000 or priref>=300000000'
    scope: 'api'
    # Alleen bij scope oai: de OAI-set books bevat ook tijdschriftartikelen (priref 2e8 tot 3e8); die gaan via de bron article.
    exclude_priref: [[200000000, 299999999]]
    oai: {set: 'books', prefix: 'oai_dc_book'}
    # link naar het record in de catalogus
    catalog_url: 'https://catalogus.cultureelerfgoed.nl/Details/fullCatalogue/{priref}'
  article:
    kind: 'article'
    api_search: 'priref>=200000000 and priref<300000000'
    # De API geeft per alias een eigen lijst velden, en bij een oogst (veel treffers) minder dan bij één record. De alias `article`
    # geeft in een oogst geen lead_word, geen CHT-koppelingen en geen `source.title.lref`; `books` geeft de groep Source niet. De alias
    # `archrep` heeft `*` als lijstvelden: alle velden. Met `fields` vragen we daaruit alleen op wat we publiceren, zodat interne
    # velden (Edit met gebruikersnamen, record_access.owner, shelf_mark) de server niet verlaten.
    api_database: 'archrep'
    api_fields: [priref, title, lead_word, author.name, corporate_author, keyword.contents, geographical_keyword, notes, abstract,
                 RNA_URI, person.keyword.name, search_year, monument.number, monument.name, monument.country, monument.province,
                 monument.county, monument.place, source.title, source.title.lead_word, source.title.lref, source.volume,
                 source.issue, source.publication_years, source.pagination, source.material_type]
    scope: 'api'
    oai: {set: 'article', prefix: 'oai_dc'}
    catalog_url: 'https://catalogus.cultureelerfgoed.nl/Details/fullCatalogue/{priref}'

### Kwaliteitsbewaking ###
# aantal records dat bij de transformatie mag falen voordat de run als mislukt geldt (0 = geen enkel)
MAX_RECORD_ERRORS: 0
# aantal records dat de OAI publiceert maar dat in het API niet (meer) gevonden wordt (0 = geen enkel)
MAX_MISSING_IN_API: 0
# aantal te publiceren records dat het API zelf niet kan uitleveren omdat het record in de bron fout staat (bijvoorbeeld
# een tekst in een getalveld). Ze worden overgeslagen en met priref in het manifest genoemd; meld ze bij de beheerder.
MAX_UNREADABLE_IN_API: 10
# aantal boeken zonder titel in het API (lege records in de bron: alleen een priref). Ze worden niet gepubliceerd, want schema:name
# is voor een Book verplicht, en staan met priref in het manifest. Gemeten op 20 november: 18 van 216.887. Een veel hoger aantal
# betekent dat de API-alias de titel niet teruggeeft; de run faalt dan.
MAX_EMPTY_IN_API: 50
# percentage artikelen met een tijdschrift dat geen `source.title.lref` (adres van het tijdschriftrecord) heeft. Gemeten: 0%.
# Een hoog percentage betekent dat de API-alias dat veld niet teruggeeft; de run faalt dan.
MAX_UNLINKED_JOURNAL_PERCENT: 2

